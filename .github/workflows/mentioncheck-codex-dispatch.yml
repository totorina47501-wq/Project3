name: MentionCheck Codex dispatch
# Explicit opt-in: agent:codex ONLY, never agent:approved (Copilot queue).
# This workflow does not merge, deploy, or execute PR code.
on:
  schedule:
    - cron: '5,35 * * * *'
  # React immediately to new explicitly labeled Codex missions, and also recover after closures.
  issues:
    types: [opened, labeled, closed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect only, do not assign a new agent
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: mentioncheck-codex-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CODEX_DISPATCH_TOKEN: ${{ secrets.CODEX_DISPATCH_TOKEN || secrets.COPILOT_DISPATCH_TOKEN || secrets.GH_AW_AGENT_TOKEN }}
    steps:
      - name: Select up to three safe Codex issues and verify assignments
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.CODEX_DISPATCH_TOKEN || secrets.COPILOT_DISPATCH_TOKEN || secrets.GH_AW_AGENT_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            if (owner !== 'totorina47501-wq' || repo !== 'Project3') {
              throw Error('Incorrect repository');
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100
            });
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const isCodex = (user) => user?.login === 'Codex';
            const MAX_ACTIVE = 3;
            const activeIssues = issues.filter(i => !i.pull_request && i.state === 'open' &&
              i.assignees?.some(isCodex));
            const activePrs = prs.filter(p => p.state === 'open' && isCodex(p.user));
            // "Refs #N" is the non-closing link used by the current Codex PRs.
            // Counting only "Closes #N" double-counts an issue and its PR.
            const referencesIssue = (pr, number) => new RegExp(
              '(?:refs?|fix(?:es|ed)?|clos(?:es|ed)?|resolv(?:es|ed)?)\\s+#' + number + '\\b', 'i'
            ).test((pr.title || '') + ' ' + (pr.body || ''));
            // A PR and its already assigned issue represent the same mission,
            // never two slots. An orphan/stale PR still reserves a slot for review.
            let active = activeIssues.length + activePrs.filter(p =>
              !activeIssues.some(i => referencesIssue(p, i.number))
            ).length;
            core.info('Codex occupied slots: ' + active + ' / ' + MAX_ACTIVE);
            if (active >= MAX_ACTIVE) {
              core.info('Codex capacity reached. No assignment.');
              return;
            }
            const hasLabel = (i, name) => i.labels?.some(l => l.name === name);
            // Read the existing evidence register from trusted main before assigning a new mission.
            const registryBlob = (await github.rest.repos.getContent({
              owner, repo, path:'docs/work-registry.json', ref:'main'
            })).data;
            if(registryBlob.type !== 'file' || registryBlob.encoding !== 'base64')
              throw Error('Operational registry not readable');
            const registry = JSON.parse(Buffer.from(registryBlob.content,'base64').toString('utf8'));
            const candidateIssues = issues.filter(i =>
              !i.pull_request && hasLabel(i, 'agent:codex') &&
              !hasLabel(i, 'agent:approved') &&
              !i.assignees?.some(a => ['Codex','Copilot','copilot-swe-agent[bot]'].includes(a.login))
            ).sort((a,b) => a.number-b.number);
            for (const issue of candidateIssues) {
              const number = issue.number;
              if (prs.some(pr => referencesIssue(pr, number))) {
                core.info('Issue #'+number+' has an open linked PR; skipping.');
                continue;
              }
              const latest = (await github.rest.issues.get({owner,repo,issue_number:number})).data;
              if (latest.state !== 'open' ||
                  !hasLabel(latest,'agent:codex') || hasLabel(latest,'agent:approved') ||
                  latest.assignees?.some(a => ['Codex','Copilot','copilot-swe-agent[bot]'].includes(a.login))) {
                continue;
              }
              const markers = [...(latest.body||'').matchAll(
                /<!--\s*mentioncheck-work-id:\s*([a-z0-9-]+)\s*-->/g
              )];
              const workId = markers.length === 1 ? markers[0][1] : null;
              if(!workId || !registry.operations?.some(x=>x.id===workId && x.status==='pending')){
                core.info('Blocked #'+number+': work-id absent, done, in progress, or unregistered.');
                continue;
              }
              if(issues.some(i=>!i.pull_request && i.state==='open' && i.number!==number &&
                (i.body||'').includes('<!-- mentioncheck-work-id: '+workId+' -->'))){
                core.info('Blocked #'+number+': duplicate open issue for work-id '+workId);
                continue;
              }
              const dryRun = context.eventName === 'workflow_dispatch' &&
                String(context.payload.inputs?.dry_run) === 'true';
              if (dryRun) {
                core.info('Dry-run: would assign Codex to #'+number);
                return;
              }
              if (!process.env.CODEX_DISPATCH_TOKEN) {
                throw Error('Missing CODEX_DISPATCH_TOKEN or existing Copilot dispatch PAT');
              }
              // REST returned success without persisting Codex on issue #86.
              // Prefer GitHub GraphQL with the verified partner Bot node ID.
              const identity = (await github.rest.pulls.get({owner,repo,pull_number:79})).data.user;
              if (identity?.login !== 'Codex' || identity.type !== 'Bot' || !identity.node_id) {
                throw Error('Verified Codex Bot identity unavailable');
              }
              const headers = {'GraphQL-Features':'issues_copilot_assignment_api_support,coding_agent_model_selection'};
              const lookup = await github.graphql(
                'query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){issue(number:$number){id}}}',
                {owner,name:repo,number,headers}
              );
              const issueId = lookup.repository?.issue?.id;
              if (!issueId) throw Error('Missing issue GraphQL node ID');
              await github.graphql(
                'mutation($issueId:ID!,$botIds:[ID!]!){addAssigneesToAssignable(input:{assignableId:$issueId,assigneeIds:$botIds}){assignable{... on Issue{id assignees(first:20){nodes{login}}}}}}',
                {issueId,botIds:[identity.node_id],headers}
              );
              const check = (await github.rest.issues.get({owner,repo,issue_number:number})).data;
              if (!check.assignees?.some(isCodex)) {
                throw Error('Codex GraphQL assignee not persisted on issue #'+number);
              }
              active += 1;
              core.info('Codex assignee verified on #'+number+'; occupied slots '+active+' / '+MAX_ACTIVE+'. Confirm session and PR separately.');
              if (active >= MAX_ACTIVE) {
                core.info('Codex capacity filled. Stop dispatch.');
                break;
              }
            }
            core.info('Codex dispatch finished; occupied slots '+active+' / '+MAX_ACTIVE+'.');
