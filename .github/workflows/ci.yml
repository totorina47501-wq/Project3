# Chemin : .github/workflows/ci.yml
name: MentionCheck CI

on:
  pull_request:
  push:
    branches: [main, feat/mentioncheck-bloc-1-fondations]

# Une seule CI par commit de branche avec PR, et une CI par push sur main.
concurrency:
  group: mentioncheck-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_PAUSED: 'true'
      OPENAI_TEXT_ENABLED: 'false'
      OPENAI_VISION_ENABLED: 'false'
      OPENAI_AUDIO_ENABLED: 'false'
      OPENAI_EMBEDDINGS_ENABLED: 'false'
      BILLING_ENABLED: 'false'
      MEDIA_RETENTION_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Registre anti-doublons (sans réseau)
        run: node scripts/work-inventory.mjs check && node --test scripts/work-inventory.test.mjs
      - name: Installer les dépendances
        run: npm ci --ignore-scripts
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests unitaires
        run: npm test
      - name: Installer FFmpeg pour les tests médias réels
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Tests vidéo hors ligne (aucun appel IA)
        run: npm run test:video:offline
      - name: Tests carrousels hors ligne (aucun appel IA)
        run: npm run test:carousel:offline
      - name: Jobs médias et reprise hors ligne
        run: npm run test:media-jobs:offline
      - name: SQL et RLS sur PostgreSQL embarqué isolé
        run: npm run test:sql-harness && npm run test:sql:offline
      - name: Effacement sur base exclusivement locale jetable
        run: npm run test:privacy:offline
      - name: Préparation des données IA sans réseau
        run: npm run test:training:offline
      - name: Fixture HTTP locale
        run: npm run test:fixtures
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Parcours Playwright locaux sans fournisseur
        run: npm run test:e2e
      - name: Compilation Next.js
        run: npm run build
      - name: Packager OpenNext pour Cloudflare (offline, sans déploiement)
        run: npm run test:cloudflare:bundle
