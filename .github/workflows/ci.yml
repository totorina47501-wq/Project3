# Chemin : .github/workflows/ci.yml
name: MentionCheck CI

on:
  pull_request:
  push:
    branches: [main, feat/mentioncheck-bloc-1-fondations]
  # Explicit post-merge CI: GITHUB_TOKEN bot merges do not generate push workflows.
  workflow_dispatch:

# Une seule CI par commit de branche avec PR, et une CI par push sur main.
permissions:
  contents: read

concurrency:
  group: mentioncheck-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Pin the OS: ubuntu-latest started transitioning to 26.04 and apt downloads
    # for FFmpeg can stall the full CI despite passing tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENAI_PAUSED: 'true'
      OPENAI_TEXT_ENABLED: 'false'
      OPENAI_VISION_ENABLED: 'false'
      OPENAI_AUDIO_ENABLED: 'false'
      OPENAI_EMBEDDINGS_ENABLED: 'false'
      BILLING_ENABLED: 'false'
      MEDIA_RETENTION_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Registre anti-doublons (sans réseau)
        run: node scripts/work-inventory.mjs check && node --test scripts/work-inventory.test.mjs
      - name: Installer les dépendances
        run: npm ci --ignore-scripts
      - name: Audit des dépendances de production
        run: npm audit --omit=dev --audit-level=moderate
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Corpus juridique et import contrôlé hors ligne
        run: npm run test:mia:offline
      - name: Diagnostic commercial hors ligne (sans fournisseur)
        run: node --test --experimental-test-isolation=none scripts/commercial/*.test.mjs
      - name: Tests unitaires
        run: npm test
      # GitHub runner Ubuntu 24.04 doesn't consistently include FFmpeg.
      # APT downloads from the Azure mirror repeatedly timed out (5 min).
      # Cache the immutable GitHub release archive and verify SHA256 on EVERY run,
      # including cache hits. No third-party Actions and no APT dependency.
      - name: Cache FFmpeg statique pour CI
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ffmpeg-7.0.2-amd64-static.tar.xz
          key: mentioncheck-ffmpeg-static-v7.0.2-amd64-abda8d77ce830914
      - name: Installer FFmpeg et FFprobe statiques avec empreinte vérifiée
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ffmpeg-7.0.2-amd64-static.tar.xz"
          if [ ! -f "$archive" ]; then
            curl --fail --location --retry 2 --retry-delay 3 --connect-timeout 15 --max-time 240 \
              --output "$archive" \
              'https://github.com/publicala/ffmpeg-static/releases/download/v7.0.2/ffmpeg-7.0.2-amd64-static.tar.xz'
          fi
          printf '%s  %s\n' 'abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67' "$archive" | sha256sum --check
          bin_dir="$RUNNER_TEMP/mentioncheck-ffmpeg/7.0.2"
          mkdir -p "$bin_dir"
          tar -xJf "$archive" -C "$bin_dir" --strip-components=1 \
            ffmpeg-7.0.2-amd64-static/ffmpeg ffmpeg-7.0.2-amd64-static/ffprobe
          test -x "$bin_dir/ffmpeg"
          test -x "$bin_dir/ffprobe"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          # Les tests média existants invoquent aussi /usr/bin/ffmpeg et
          # /usr/bin/ffprobe en chemins absolus, pas seulement via PATH.
          # Installer les binaires vérifiés à ces emplacements dans ce runner
          # éphémère ; ne toucher ni aux fixtures ni aux processeurs.
          sudo install -m 0755 "$bin_dir/ffmpeg" /usr/bin/ffmpeg
          sudo install -m 0755 "$bin_dir/ffprobe" /usr/bin/ffprobe
          /usr/bin/ffmpeg -version | head -n 1
          /usr/bin/ffprobe -version | head -n 1
      - name: Tests vidéo hors ligne (aucun appel IA)
        run: npm run test:video:offline
      - name: Tests carrousels hors ligne (aucun appel IA)
        run: npm run test:carousel:offline
      - name: Jobs médias et reprise hors ligne
        run: npm run test:media-jobs:offline
      - name: SQL et RLS sur PostgreSQL embarqué isolé
        run: npm run test:sql-harness && npm run test:sql:offline
      - name: Effacement sur base exclusivement locale jetable
        run: npm run test:privacy:offline
      - name: Préparation des données IA sans réseau
        run: npm run test:training:offline
      - name: Fixture HTTP locale
        run: npm run test:fixtures
      # GitHub-hosted Ubuntu already carries Chromium's shared libraries.
      # Avoid APT mirrors (the --with-deps step may stall) while caching only
      # the browser downloaded by the repository's pinned Playwright version.
      - name: Cache Chromium Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: mentioncheck-playwright-chromium-v1.64.1-${{ runner.os }}-${{ runner.arch }}
      - name: Installer Chromium
        timeout-minutes: 8
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: |
          npx playwright install chromium || (sleep 3 && npx playwright install chromium)
      - name: Parcours Playwright locaux sans fournisseur
        env:
          MEDIA_PROCESSING_ENABLED: 'true'
          MEDIA_JOBS_SCHEMA_READY: 'true'
          MEDIA_AI_ENABLED: 'true'
        run: npm run test:e2e
      - name: Compilation Next.js
        run: npm run build
      - name: Packager OpenNext pour Cloudflare (offline, sans déploiement)
        run: npm run test:cloudflare:bundle

  media-container:
    name: Image du runner média (sans fournisseur)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Valider la configuration Compose sans secret
        run: docker compose -f workers/media-jobs/compose.yaml config --quiet
      - name: Construire l’image sans publication de registre
        run: docker build --file workers/media-jobs/Dockerfile --tag mentioncheck-media-runner:ci .
      - name: Recette Sharp et FFmpeg dans le conteneur sans réseau
        run: |
          docker run --rm --init --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --memory 1g --cpus 1.5 --pids-limit 128 \
            --tmpfs /work:uid=1000,gid=1000,mode=0700,size=512m \
            --tmpfs /tmp:uid=1000,gid=1000,mode=0700,size=64m \
            --mount type=bind,source="$GITHUB_WORKSPACE/workers/media-jobs/tests/container-smoke.node.mjs",target=/app/validation.mjs,readonly \
            mentioncheck-media-runner:ci node /app/validation.mjs
