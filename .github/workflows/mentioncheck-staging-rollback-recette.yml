# Rollback réel de STAGING seulement, jamais main ni production.
name: MentionCheck Staging reversible rollback
on:
  push:
    branches: [test/mentioncheck-staging-auth-20261108, codex/codex-certification-six-chantiers]
    paths:
      - '.github/workflows/mentioncheck-staging-rollback-recette.yml'
      - 'scripts/recette/staging-reversible-rollback.mjs'
      - 'scripts/recette/staging-code-rollback.mjs'
permissions:
  contents: read
concurrency:
  group: mentioncheck-staging-cloudflare
  cancel-in-progress: false
jobs:
  rollback-staging:
    if: github.repository == 'totorina47501-wq/Project3' && (github.ref == 'refs/heads/test/mentioncheck-staging-auth-20261108' || github.ref == 'refs/heads/codex/codex-certification-six-chantiers')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ukvgnkxgzyhswgpnvyzz.supabase.co
      NEXT_PUBLIC_APP_URL: https://mentioncheck-staging.toto-rina47501.workers.dev
      OPENAI_PAUSED: 'true'
      OPENAI_TEXT_ENABLED: 'false'
      OPENAI_VISION_ENABLED: 'false'
      OPENAI_AUDIO_ENABLED: 'false'
      OPENAI_EMBEDDINGS_ENABLED: 'false'
      BILLING_ENABLED: 'false'
      PROMO_SOLO_ENABLED: 'false'
      MEDIA_AI_ENABLED: 'false'
      MEDIA_RETENTION_ENABLED: 'false'
      MEDIA_PROCESSING_ENABLED: 'false'
      MEDIA_CLOUDFLARE_RUNNER_ENABLED: 'false'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_ANON_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MENTIONCHECK_STAGING_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.MENTIONCHECK_STAGING_CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/recette/check-cloudflare-staging-boundary.mjs
      - name: Installer le CLI Wrangler verrouillé
        run: npm ci --ignore-scripts
      - name: Ancienne recette avec meme code (branche historique)
        if: github.ref == 'refs/heads/test/mentioncheck-staging-auth-20261108'
        run: node scripts/recette/staging-reversible-rollback.mjs
      - name: Deux SHA de code et restauration du Worker staging initial
        if: github.ref == 'refs/heads/codex/codex-certification-six-chantiers'
        timeout-minutes: 35
        run: node scripts/recette/staging-code-rollback.mjs
