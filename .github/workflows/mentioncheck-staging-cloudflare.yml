# Déploiement sûr et explicite ; aucune PR ou push ne publie un Worker.
name: MentionCheck Staging Cloudflare
on:
  push:
    branches: [ops/staging-auth-align-20261114]
    paths: ['.github/workflows/mentioncheck-staging-cloudflare.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (aucune publication) ou publish (staging seulement)"
        type: choice
        options: [dry-run, publish]
        default: dry-run
        required: true
permissions:
  contents: read
concurrency:
  group: mentioncheck-staging-cloudflare
  cancel-in-progress: false
jobs:
  staging:
    if: github.repository == 'totorina47501-wq/Project3' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/ops/staging-auth-align-20261114'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ukvgnkxgzyhswgpnvyzz.supabase.co
      NEXT_PUBLIC_APP_URL: https://mentioncheck-staging.toto-rina47501.workers.dev
      OPENAI_PAUSED: 'true'
      OPENAI_TEXT_ENABLED: 'false'
      OPENAI_VISION_ENABLED: 'false'
      OPENAI_AUDIO_ENABLED: 'false'
      OPENAI_EMBEDDINGS_ENABLED: 'false'
      BILLING_ENABLED: 'false'
      MEDIA_RETENTION_ENABLED: 'false'
      MEDIA_PROCESSING_ENABLED: 'false'
      MEDIA_AI_ENABLED: 'false'
      MEDIA_CLOUDFLARE_RUNNER_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MENTIONCHECK_STAGING_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.MENTIONCHECK_STAGING_CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout CI-green brand-deals PR #168 candidate
        uses: actions/checkout@v4
        with:
          ref: 028a05fbee530e073996613883ee38020a700491
          persist-credentials: false
      - name: Verify exact approved PR #168 source SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "028a05fbee530e073996613883ee38020a700491"
          remote_pr="$(curl --fail --silent --show-error --max-time 20 -H 'Accept: application/vnd.github+json' https://api.github.com/repos/totorina47501-wq/Project3/pulls/168 | node -e 'let data="";process.stdin.on("data",x=>data+=x);process.stdin.on("end",()=>console.log(JSON.parse(data).head.sha))')"
          test "$remote_pr" = "028a05fbee530e073996613883ee38020a700491" || { echo "::error::PR #168 changed; staging release blocked"; exit 1; }
          echo 'STAGING_BRANDS_PR168_SOURCE_PINNED'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Vérifier le périmètre staging
        run: node scripts/recette/check-cloudflare-staging-boundary.mjs
      - name: Refuser publication sans les quatre secrets staging
        if: inputs.mode == 'publish' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_KEY; do
            if [[ -z "$(printenv "$name" || true)" ]]; then
              echo "::error::Secret staging manquant: $name ; déploiement interdit"
              exit 1
            fi
          done
      - name: Prouver que les deux clés sont valides sur la base Supabase staging, pas production
        if: inputs.mode == 'publish' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          staging='https://ukvgnkxgzyhswgpnvyzz.supabase.co'
          anonymous_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" "$staging/auth/v1/settings")"
          if [[ "$anonymous_status" != '200' ]]; then
            echo "::error::Clé publique invalide pour le Supabase staging (HTTP $anonymous_status)."
            exit 1
          fi
          admin_status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -H "apikey: $SUPABASE_SERVICE_KEY" "$staging/rest/v1/")"
          if [[ "$admin_status" != '200' ]]; then
            echo "::error::Clé serveur non autorisée sur le Supabase staging (HTTP $admin_status)."
            exit 1
          fi
      - name: Fournir une clé fictive pour le dry-run sans authentification
        if: inputs.mode == 'dry-run'
        run: echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=staging-dry-run-placeholder" >> "$GITHUB_ENV"
      - name: Contrôler les frontières du Worker staging avant publication
        if: inputs.mode == 'publish' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const acc=process.env.CLOUDFLARE_ACCOUNT_ID;
          const key=process.env.CLOUDFLARE_API_TOKEN;
          assert.ok(acc && key, 'Missing staging account credentials');
          const url=`https://api.cloudflare.com/client/v4/accounts/${acc}/workers/scripts/mentioncheck-staging/settings`;
          const resp=await fetch(url,{headers:{Authorization:`Bearer ${key}`}});
          const data=await resp.json();
          assert.ok(resp.ok && data.success && Array.isArray(data.result?.bindings),'Staging settings unavailable');
          const flags=new Map(data.result.bindings.filter(x=>x.type==='plain_text').map(x=>[x.name,x.text]));
          assert.equal(flags.get('NEXT_PUBLIC_SUPABASE_URL'),'https://ukvgnkxgzyhswgpnvyzz.supabase.co','Wrong staging database');
          assert.equal(flags.get('NEXT_PUBLIC_APP_URL'),'https://mentioncheck-staging.toto-rina47501.workers.dev','Wrong staging hostname');
          assert.equal(flags.get('BILLING_ENABLED'),'false','Checkout must stay off');
          assert.equal(flags.get('STRIPE_MODE'),'test','Staging must be Stripe TEST');
          assert.equal(flags.get('OPENAI_PAUSED'),'true','OpenAI must remain paused in staging');
          console.log('STAGING_AUTH_RELEASE_PREFLIGHT_OK isolated staging Supabase/Worker; AI and billing off');
          NODE
      - name: Installation déterministe
        run: npm ci --ignore-scripts
      - name: Compiler Next.js sur la référence staging
        run: npm run build
      - name: Construire OpenNext avec la configuration staging
        run: npx @opennextjs/cloudflare build --skipNextBuild --config wrangler.staging.jsonc
      - name: Prévisualiser le package Cloudflare sans déployer
        run: npx wrangler deploy --config wrangler.staging.jsonc --dry-run
      - name: Publier uniquement mentioncheck-staging
        if: inputs.mode == 'publish' || github.event_name == 'push'
        run: npx @opennextjs/cloudflare deploy --config wrangler.staging.jsonc -- --keep-vars
      - name: Définir les secrets sur le Worker staging uniquement
        if: inputs.mode == 'publish' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$NEXT_PUBLIC_SUPABASE_ANON_KEY" | npx wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --config wrangler.staging.jsonc
          printf '%s' "$SUPABASE_SERVICE_KEY" | npx wrangler secret put SUPABASE_SERVICE_KEY --config wrangler.staging.jsonc
      - name: Vérifier les quatre pages d'authentification staging
        if: inputs.mode == 'publish' || github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          stage='https://mentioncheck-staging.toto-rina47501.workers.dev'
          for page in /login /register /forgot-password /reset-password; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 25 "${stage}${page}" -o /dev/null
            echo "STAGING_AUTH_HTTP_OK ${page}"
          done
          content="$(curl --fail --silent --show-error --max-time 25 "${stage}/login")"
          grep -q 'Mot de passe oublié' <<< "$content" || { echo "::error::Version Auth attendue non visible"; exit 1; }
          echo 'STAGING_AUTH_FEATURES_VISIBLE; email recovery links require separate Supabase allowlist verification'
          legal="$(curl --fail --silent --show-error --max-time 25 "${stage}/legal/mentions-legales")"
          grep -q 'en cours de vérification' <<< "$legal" || { echo 'Precommercial registration notice missing'; exit 1; }
          if grep -q 'SIRET déclaré par l' <<< "$legal"; then echo 'Unverified SIRET visibly claimed'; exit 1; fi
          if grep -q 'TVA non applicable, art.' <<< "$legal"; then echo 'Unverified VAT exemption visibly claimed'; exit 1; fi
          curl --fail --silent --show-error --max-time 25 "${stage}/legal/cgu" -o /dev/null
          curl --fail --silent --show-error --max-time 25 "${stage}/legal/confidentialite" -o /dev/null
          echo 'STAGING_LEGAL_PRELAUNCH_VISIBLE_AND_PAYMENT_GUARDS_OFF'
      - name: Auth A/B + collaborations RPC legacy, stockage, nettoyage fixture sur staging
        if: inputs.mode == 'publish' || github.event_name == 'push'
        env:
          MENTIONCHECK_STAGING_SUPABASE_ANON_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_ANON_KEY }}
          MENTIONCHECK_STAGING_SUPABASE_SERVICE_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_SERVICE_KEY }}
        run: node scripts/recette/staging-auth-ab.mjs
