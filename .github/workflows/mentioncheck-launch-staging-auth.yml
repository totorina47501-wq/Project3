# Recette Auth sans IA, Stripe ni publication production.
name: MentionCheck Launch Auth Staging
on:
  push:
    branches: [feat/mentioncheck-launch-decisions-20261110, copilot/social-oauth-001-completion-phase-2]
permissions:
  contents: read
concurrency:
  group: mentioncheck-staging-cloudflare
  cancel-in-progress: false
jobs:
  auth-staging:
    if: >-
      github.repository == 'totorina47501-wq/Project3' &&
      (github.ref == 'refs/heads/feat/mentioncheck-launch-decisions-20261110' ||
      (github.ref == 'refs/heads/copilot/social-oauth-001-completion-phase-2' &&
       (github.event.head_commit.message == 'chore(oauth): sync staging vars once (#124)' ||
        (github.event.head_commit.message == 'fix(oauth): accept Google callback metadata (#124)' ||
        (github.event.head_commit.message == 'fix(oauth): surface safe provider failure stage (#124)' ||
        (github.event.head_commit.message == 'test(oauth): verify failure stage regression (#124)' ||
        (github.event.head_commit.message == 'fix(oauth): resolve diagnostics typecheck (#124)' ||
        (github.event.head_commit.message == 'fix(oauth): count persisted connected social accounts (#124)' ||
        (github.event.head_commit.message == 'fix(oauth): classify Google token exchange errors (#124)' ||
        github.event.head_commit.message == 'fix(oauth): use Cloudflare-supported manual redirects (#124)')))))))))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ukvgnkxgzyhswgpnvyzz.supabase.co
      NEXT_PUBLIC_APP_URL: https://mentioncheck-staging.toto-rina47501.workers.dev
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_KEY: ${{ secrets.MENTIONCHECK_STAGING_SUPABASE_SERVICE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MENTIONCHECK_STAGING_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.MENTIONCHECK_STAGING_CLOUDFLARE_API_TOKEN }}
      OPENAI_PAUSED: 'true'
      OPENAI_TEXT_ENABLED: 'false'
      OPENAI_VISION_ENABLED: 'false'
      OPENAI_AUDIO_ENABLED: 'false'
      OPENAI_EMBEDDINGS_ENABLED: 'false'
      BILLING_ENABLED: 'false'
      PROMO_SOLO_ENABLED: 'false'
      MEDIA_RETENTION_ENABLED: 'false'
      MEDIA_PROCESSING_ENABLED: 'false'
      MEDIA_AI_ENABLED: 'false'
      MEDIA_CLOUDFLARE_RUNNER_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Valider strictement les secrets GitHub staging
        shell: bash
        run: |
          set -euo pipefail
          for key in NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [[ -z "$(printenv "$key" || true)" ]]; then
              echo "::error::Secret staging manquant : $key"
              exit 1
            fi
          done
      - name: Frontière staging et absence de service payant
        run: |
          node scripts/recette/check-cloudflare-staging-boundary.mjs
          node scripts/recette/check-cloudflare-preview-boundary.mjs
          node --check scripts/recette/auth-staging-smoke.mjs
      - name: Installer le lockfile sans hooks externes
        run: npm ci --ignore-scripts
      - name: TypeScript et build staging OpenNext
        run: |
          npm run typecheck
          npx vitest run tests/unit/social-oauth.test.ts tests/unit/social-oauth-routes.test.ts tests/unit/social-oauth-exchange.test.ts
          npm run build
          npx @opennextjs/cloudflare build --skipNextBuild --config wrangler.staging.jsonc
          npx wrangler deploy --config wrangler.staging.jsonc --dry-run
      - name: Publier exclusivement mentioncheck-staging (billing/IA/promo OFF)
        run: npx @opennextjs/cloudflare deploy --config wrangler.staging.jsonc -- --keep-vars
      - name: Recette HTTP Auth + fermeture Stripe + utilisateur synthétique jetable
        run: node scripts/recette/auth-staging-smoke.mjs
