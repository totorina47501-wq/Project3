name: Agent safe-code auto-merge
# Trusted workflow only; never check out PR code with a write token.
on:
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:
  # Events wake the trusted default-branch workflow; never check out PR code.
  # A Copilot agent can finish AFTER PR CI has already succeeded.
  workflow_run:
    workflows: ["MentionCheck CI", "Running Copilot cloud agent"]
    types: [completed]
  pull_request_target:
    types: [ready_for_review, edited, synchronize]
permissions:
  contents: write
  pull-requests: write
  issues: write
  # Required only to explicitly dispatch trusted workflows after bot merges.
  actions: write
concurrency:
  group: mentioncheck-safe-agent-merge
  cancel-in-progress: false
jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify safe files and full CI then merge
        shell: bash
        run: |
          set -euo pipefail
          [ "$REPO" = "totorina47501-wq/Project3" ] || exit 1
          numbers="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.pull_requests[].number')"
          [ "$(printf '%s\n' "$numbers" | sed '/^$/d' | wc -l)" -eq 1 ] || exit 0
          number="$numbers"
          pr="$(gh api "repos/$REPO/pulls/$number")"
          [ "$(jq -r .state <<< "$pr")" = open ] || exit 0
          [ "$(jq -r .base.ref <<< "$pr")" = main ] || exit 0
          [ "$(jq -r .head.repo.full_name <<< "$pr")" = "$REPO" ] || exit 0
          [ "$(jq -r .head.sha <<< "$pr")" = "$RUN_SHA" ] || exit 0
          [ "$(jq -r .user.login <<< "$pr")" = Copilot ] || exit 0
          # Keep the existing docs-only auto-merge as the sole handler for its opt-in PRs.
          jq -e '[.labels[].name] | index("factory:auto-merge-safe") == null' <<< "$pr" >/dev/null || exit 0

          # Only automatic merges of tests, local fixtures and documentation.
          # Changes to production code, dependencies, scripts, deployment, API,
          # authentication implementation or workflows are never auto-merged.
          changed="$(gh api --paginate "repos/$REPO/pulls/$number/files?per_page=100")"
          count="$(jq 'length' <<< "$changed")"
          [ "$count" -gt 0 ] && [ "$count" -le 30 ] || exit 0
          while IFS=$'\t' read -r file status additions deletions; do
            [ "$status" != removed ] || exit 0
            [ "$status" != renamed ] || exit 0
            case "$file" in
              tests/*|workers/media-jobs/tests/*.test.mjs|docs/*.md|docs/*/*.md|docs/work-registry.json)
                ;;
              *)
                echo "Not eligible for trusted auto-merge: $file"
                exit 0
                ;;
            esac
            # No large unreviewed changes.
            [ "$additions" -le 500 ] && [ "$deletions" -le 500 ] || exit 0
          done < <(jq -r '.[] | [.filename,.status,(.additions|tostring),(.deletions|tostring)] | @tsv' <<< "$changed")

          jobs="$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | [.name,.conclusion] | @tsv')"
          grep -Fxq "$(printf 'quality\tsuccess')" <<< "$jobs" || exit 0
          grep -Fxq "$(printf 'Image du runner média (sans fournisseur)\tsuccess')" <<< "$jobs" || exit 0
          # Copilot normally opens draft PRs. Mark one ready automatically only
          # after the cloud agent for its branch has completed successfully.
          if [ "$(jq -r .draft <<< "$pr")" = true ]; then
            head_branch="$(jq -r '.head.ref' <<< "$pr")"
            agent_runs="$(gh api "repos/$REPO/actions/runs?branch=$head_branch&per_page=100")"
            jq -e '[.workflow_runs[] | select(.name == "Running Copilot cloud agent" and .status == "completed" and .conclusion == "success")] | length > 0' <<< "$agent_runs" >/dev/null || exit 0
            node_id="$(jq -r .node_id <<< "$pr")"
            gh api graphql -f query='mutation($id: ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' -f id="$node_id" >/dev/null
          fi
          # Require CI success on exact PR head and recheck immediately.
          [ "$(gh api "repos/$REPO/pulls/$number" --jq '.head.sha')" = "$RUN_SHA" ] || exit 0
          gh api --method PUT "repos/$REPO/pulls/$number/merge" \
            -f merge_method=squash -f sha="$RUN_SHA" \
            -f commit_title="test: verified Copilot PR #$number"
          echo "Merged fully verified safe Copilot PR #$number." >> "$GITHUB_STEP_SUMMARY"
          # GITHUB_TOKEN merges do not emit a new push workflow. workflow_dispatch
          # is explicitly allowed and enforces the full trusted main CI.
          gh api --method POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref=main
          echo "Triggered main CI after GitHub bot merge." >> "$GITHUB_STEP_SUMMARY"

  recovery:
    # Re-evaluate safe completed Copilot PRs after CI success as well as on the
    # schedule; GitHub schedule may be delayed or skipped. No untrusted checkout.
    # Wait for the exact-PR merge job in the same workflow, never race it.
    needs: merge
    if: >-
      ${{
        always() &&
        github.repository == 'totorina47501-wq/Project3' &&
        github.ref == 'refs/heads/main' &&
        needs.merge.result != 'failure' &&
        (
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.user.login == 'Copilot' &&
            github.event.pull_request.base.ref == 'main'
          ) ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            (
              github.event.workflow_run.event == 'pull_request' ||
              github.event.workflow_run.name == 'Running Copilot cloud agent' ||
              github.event.workflow_run.event == 'push'
              || github.event.workflow_run.event == 'workflow_dispatch'
            )
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        name: Re-evaluate safe completed Copilot PRs
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            if (context.ref !== 'refs/heads/main' || owner !== 'totorina47501-wq' || repo !== 'Project3') throw Error('Untrusted context');
            const prs = await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            let checked=0;
            for (const pr of prs.sort((a,b)=>a.number-b.number)) {
              if (checked >= 10) break;
              if (pr.user?.login !== 'Copilot' || pr.base?.ref !== 'main' ||
                  pr.head?.repo?.full_name !== owner+'/'+repo || !pr.head?.ref?.startsWith('copilot/') ||
                  pr.labels?.some(l=>l.name==='factory:auto-merge-safe')) continue;
              checked++;
              const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:pr.number,per_page:100});
              // Invariant: one explicitly approved open issue, assigned to Copilot.
              // No self-approved PR or unlabeled backlog may reach the merge gate.
              const closingRefs=[...String(pr.body||'').matchAll(/\b(?:fix(?:es|ed)?|clos(?:es|ed)?|resolv(?:es|ed)?)\s+#(\d+)\b/gi)]
                .map(match=>Number(match[1]));
              // One unique closing issue is required, even when the same closing ref
              // appears both in Copilot's quoted issue text and PR summary.
              if (new Set(closingRefs).size!==1) continue;
              const ticket=(await github.rest.issues.get({owner,repo,issue_number:closingRefs[0]})).data;
              if (ticket.state!=='open' || !ticket.labels?.some(l=>l.name==='agent:approved') ||
                  ticket.labels?.some(l=>['agent:codex','release:evidence-required','security:manual'].includes(l.name)) ||
                  !ticket.assignees?.some(a=>['Copilot','copilot-swe-agent[bot]'].includes(a.login))) continue;
              if (pr.labels?.some(l=>['release:evidence-required','security:manual','do-not-merge','agent:codex'].includes(l.name))) continue;
              const isDoc=(path)=> /^docs\/.+\.md$/.test(path) &&
                !/^docs\/(12-privacy-security|08-studio|04-mia-archives|42-copilot-mobile-workflow)\.md$/.test(path) &&
                !/^docs\/(security|contracts|legal)\//.test(path);
              const isTest=(path)=>/^tests\//.test(path) ||
                /^workers\/media-jobs\/tests\/[^/]+\.test\.mjs$/.test(path);
              // Small, reviewed UI surface only. APIs, auth, security, SQL, deployment,
              // workflows, config, dependencies and service integrations fail closed.
              const isUi=(path)=>/^app\/dashboard\/(?:layout\.tsx|(?:check|archive|media|mia|studio|brand-deals)\/page\.tsx)$/.test(path) ||
                /^components\/(?:DashboardMobileNavigation|AIStreamProgress|ComplianceScore|ViolationList|AIRewriteDiff|LogoutButton)\.tsx$/.test(path);
              const unsafeChange=/(?:\b(?:fetch|XMLHttpRequest|sendBeacon|WebSocket|EventSource|eval|Function|postMessage|open)\s*\(|document\.cookie|localStorage|sessionStorage|process\.env|dangerouslySetInnerHTML|innerHTML|createBrowserSupabase|createServerSupabase|supabase\.auth|@\/lib\/(?:security|supabase)|https?:\/\/)/i;
              const safe=files.length>0 && files.length<=30 && files.every(f=>{
                const path=f.filename;
                if (!['added','modified'].includes(f.status) || f.additions>500 || f.deletions>500) return false;
                if (isTest(path) || isDoc(path) || path==='docs/work-registry.json') return true;
                if (!isUi(path) || f.additions>250 || f.deletions>250 || !f.patch) return false;
                const added=f.patch.split('\n').filter(line=>line.startsWith('+') && !line.startsWith('+++'))
                  .map(line=>line.slice(1)).join('\n');
                return !unsafeChange.test(added);
              });
              if (!safe) {
                core.notice('PR #'+pr.number+' requires separate security review (unsafe file or diff); not auto-merged.');
                continue;
              }
              // A successful CI is necessary but never sufficient: an approved
              // issue, trusted Copilot identity and completed cloud session also apply.
              const sha=pr.head.sha;
              const runs=await github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,branch:pr.head.ref,per_page:100});
              const ci=runs.filter(r=>r.name==='MentionCheck CI' && r.path==='.github/workflows/ci.yml' &&
                r.event==='pull_request' && r.head_sha===sha && r.pull_requests?.some(p=>p.number===pr.number))
                .sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))[0];
              if (!ci || ci.conclusion!=='success' || ci.status!=='completed') continue;
              const agent=runs.filter(r=>r.name==='Running Copilot cloud agent')
                .sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))[0];
              if (!agent || agent.conclusion!=='success' || agent.status!=='completed') continue;
              const headCommit=(await github.rest.repos.getCommit({owner,repo,ref:sha})).data;
              if (Date.parse(agent.updated_at) < Date.parse(headCommit.commit.committer.date)) continue;
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                {owner,repo,run_id:ci.id,filter:'latest',per_page:100});
              if (!['quality','Image du runner média (sans fournisseur)'].every(name=>
                jobs.some(j=>j.name===name && j.conclusion==='success'))) continue;
              if (pr.draft) await github.graphql(
                'mutation($id: ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}',
                {id:pr.node_id});
              const latest=(await github.rest.pulls.get({owner,repo,pull_number:pr.number})).data;
              if (latest.state!=='open' || latest.draft || latest.head.sha!==sha || latest.base.ref!=='main' ||
                  latest.user?.login!=='Copilot' || latest.head.repo?.full_name!==owner+'/'+repo ||
                  latest.labels?.some(l=>['release:evidence-required','security:manual','do-not-merge','agent:codex'].includes(l.name))) continue;
              let mergedSha;
              try {
                const merged=await github.rest.pulls.merge({owner,repo,pull_number:pr.number,
                  merge_method:'squash',sha,commit_title:'feat: verified safe Copilot PR #'+pr.number});
                mergedSha=merged.data.sha;
                core.notice('Merged safe Copilot PR #'+pr.number+' at '+mergedSha);
              } catch(e) {
                core.warning('GitHub refused safe merge for PR #'+pr.number+' (HTTP '+(e.status||'unknown')+')');
                return;
              }
              // A bot merge cannot trigger CI via "push"; explicitly start main CI.
              await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'ci.yml',ref:'main'});
              core.notice('Dispatched main CI after Copilot PR #'+pr.number+' at '+mergedSha);
              return; // main may advance; next pass must revalidate from the new main
            }
            // After the latest main SHA passes complete CI, resume the approved
            // dispatcher. Its reconciliation closes merged Copilot issues before
            // counting free slots and uses the scoped Copilot assignment PAT.
            const source=context.payload.workflow_run;
            if (context.eventName==='workflow_run' && source?.conclusion==='success' &&
                ['push','workflow_dispatch'].includes(source.event) && source.head_branch==='main') {
              const current=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
              if (current===source.head_sha) {
                await github.rest.actions.createWorkflowDispatch({owner,repo,
                  workflow_id:'mentioncheck-agent-dispatch.yml',ref:'main',inputs:{dry_run:'false'}});
                core.notice('Dispatched approved Copilot backlog after green main at '+current);
              } else {
                core.notice('Skipped stale main CI '+source.head_sha+'; current main is '+current);
              }
            }
            core.summary.addRaw('Safe Copilot recovery checked '+checked+' PRs; no eligible merge.');
