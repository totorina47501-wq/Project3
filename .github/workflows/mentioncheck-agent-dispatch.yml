name: MentionCheck agent dispatch

# Scheduled checks use only the trusted default branch workflow.
# No PR checkout, no execution of untrusted code, no deployment and no external services.
on:
  schedule:
    - cron: '0,30 * * * *'
  # Wake up immediately when an issue is opened or explicitly approved;
  # GitHub's scheduled cron is best-effort and can be delayed or skipped.
  # The job still refuses unapproved issues and enforces its capacity limit.
  issues:
    types: [opened, labeled, closed]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only inspect the queue; do not assign an issue'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: mentioncheck-agent-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # GITHUB_TOKEN cannot launch a cloud-agent session via an issue assignment.
      # Use a fine-grained user token held only in GitHub Actions secrets.
      COPILOT_DISPATCH_TOKEN: ${{ secrets.COPILOT_DISPATCH_TOKEN || secrets.GH_AW_AGENT_TOKEN }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      MAX_ACTIVE: '2'
    steps:
      - name: Inspect approved issues and assign at most one Copilot mission
        shell: bash
        run: |
          set -euo pipefail

          # Only work in MentionCheck. Never dispatch SaaS Factory tasks here.
          [ "$REPO" = "totorina47501-wq/Project3" ] || exit 1

          issues="$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100")"

          # A merged Copilot PR does not always close its linked issue when a
          # GitHub Actions token performs the merge. Reconcile it before counting
          # capacity so completed work cannot block the backlog indefinitely.
          # Trust only an explicit closing reference on a merged Copilot PR
          # targeting main from this repository; never close unrelated issues.
          merged_prs="$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=100")"
          while IFS= read -r completed_number; do
            [ -n "$completed_number" ] || continue
            if jq -e --arg repo "$REPO" --arg num "$completed_number" '
              any(.[]; .merged_at != null and .user.login == "Copilot" and
                .base.ref == "main" and .head.repo.full_name == $repo and
                (.head.ref | startswith("copilot/")) and
                ((.body // "") | test("(?i)(fix(es|ed)?|close(s|d)?|resolve(s|d)?)\\s+#" + $num + "\\b"))
              )' <<< "$merged_prs" >/dev/null; then
              gh api --method PATCH "repos/$REPO/issues/$completed_number" \
                -f state=closed -f state_reason=completed >/dev/null
              echo "Closed completed Copilot issue #$completed_number after verified PR merge." >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -r '[.[] | select(.pull_request == null and .state == "open") |
            select(any(.labels[]?; .name == "agent:approved")) |
            select(any(.assignees[]?; .login == "Copilot" or .login == "copilot-swe-agent[bot]")) |
            .number] | .[]' <<< "$issues")
          issues="$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100")"
          active="$(jq '[.[] | select(.pull_request == null) |
            select(any(.assignees[]?; .login == "Copilot" or .login == "copilot-swe-agent[bot]"))] | length' <<< "$issues")"
          echo "Open issues currently assigned to Copilot: $active / $MAX_ACTIVE"
          echo "Active Copilot issues: $active / $MAX_ACTIVE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$active" -ge "$MAX_ACTIVE" ]; then
            echo "Capacity reached. No new assignment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Only explicit human-approved issues are eligible. Never use a task
          # merely because it is P0 or because a CI failed.
          candidates="$(jq -r '[.[] | select(.pull_request == null and .state == "open") |
            select(any(.labels[]?; .name == "agent:approved")) |
            select(any(.labels[]?; .name == "agent:codex") | not) |
            select(any(.assignees[]?; .login == "Codex") | not) |
            select((.assignees // [] | map(.login) | index("Copilot")) == null) |
            select((.assignees // [] | map(.login) | index("copilot-swe-agent[bot]")) == null)
            ] | sort_by(.number) | .[].number' <<< "$issues")"
          if [ -z "$candidates" ]; then
            echo "No new agent:approved issue. No action." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # All open PRs are considered to avoid accidentally duplicating
          # a task that already has an explicit 'Closes #N' reference.
          prs="$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100")"

          while read -r number; do
            [ -n "$number" ] || continue
            details="$(gh api "repos/$REPO/issues/$number")"
            [ "$(jq -r .state <<< "$details")" = open ] || continue
            jq -e '[.labels[].name] | index("agent:approved") != null' <<< "$details" >/dev/null || continue
            jq -e '[.labels[].name] | index("agent:codex") == null' <<< "$details" >/dev/null || continue
            jq -e 'any(.assignees[]?; .login == "Codex") | not' <<< "$details" >/dev/null || continue
            if jq -e --arg num "$number" '
              any(.[]; ((.body // "") + " " + (.title // "")) |
                test("(?i)(close[sd]?|fix(e[sd])?|resolve[sd]?)\\s+#" + $num + "\\b"))' <<< "$prs" >/dev/null; then
              echo "Issue #$number already linked to an open PR; skipping." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "Dry-run: would assign Copilot to #$number." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            # Copilot issue-assignment REST API requires a user token rather than
            # the built-in GITHUB_TOKEN. This is a one-time GitHub secret setup.
            # Never echo the credential, include it in job output, or fall back
            # to a token incapable of triggering the cloud agent.
            if [ -z "${COPILOT_DISPATCH_TOKEN:-}" ]; then
              echo "::error::Missing GitHub secret COPILOT_DISPATCH_TOKEN (or GH_AW_AGENT_TOKEN). Cloud-agent dispatch is NOT fully operational."
              echo "BLOCKED: no authorized Copilot assignment token configured." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            assignment="$(jq -n --arg repo "$REPO" '{assignees:["copilot-swe-agent[bot]"],agent_assignment:{target_repo:$repo,base_branch:"main"}}')"
            if ! response="$(GH_TOKEN="$COPILOT_DISPATCH_TOKEN" gh api --method POST \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/$REPO/issues/$number/assignees" --input - <<< "$assignment" 2>&1)"; then
              echo "::error::Copilot API rejected issue assignment #$number; check token permissions and agent access."
              echo "BLOCKED: Copilot assignment rejected for #$number; no task launch verified." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            checked="$(gh api "repos/$REPO/issues/$number")"
            if ! jq -e 'any(.assignees[]?; .login == "Copilot" or .login == "copilot-swe-agent[bot]")' <<< "$checked" >/dev/null; then
              echo "::error::Copilot issue assignment did not persist for #$number."
              echo "BLOCKED: Copilot assignee missing on issue #$number." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Verified Copilot assignee on approved issue #$number." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done <<< "$candidates"

          echo "No eligible issue remained after checks." >> "$GITHUB_STEP_SUMMARY"
