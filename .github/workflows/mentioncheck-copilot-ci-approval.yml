name: MentionCheck trusted Copilot CI approval

# Runs exclusively from trusted main code. It never checks out or executes a PR.
# It only starts the existing unprivileged CI; it never approves a PR review or merges.
on:
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: mentioncheck-trusted-copilot-ci-approval
  cancel-in-progress: false

jobs:
  approve:
    if: ${{ github.repository == 'totorina47501-wq/Project3' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Authorize bounded Copilot workflow runs from trusted metadata
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.COPILOT_DISPATCH_TOKEN }}
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            if (`${owner}/${repo}` !== 'totorina47501-wq/Project3' || context.ref !== 'refs/heads/main')
              throw new Error('Trusted main-only repository guard rejected');
            // This user token is stored only as a GitHub Actions secret. Never log it.
            if (!process.env.GITHUB_TOKEN && !github) throw new Error('No GitHub client');
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
              {owner, repo, event: 'pull_request', per_page: 100});
            const pending = runs.filter(run => run.name === 'MentionCheck CI'
              && run.path === '.github/workflows/ci.yml'
              && run.event === 'pull_request' && run.conclusion === 'action_required'
              && run.status === 'completed' && run.head_sha && run.head_branch)
              .sort((a,b) => a.created_at.localeCompare(b.created_at));
            if (!pending.length) { core.summary.addRaw('No Copilot CI awaiting approval.'); return; }
            const prs = await github.paginate(github.rest.pulls.list,
              {owner, repo, state: 'open', per_page: 100});
            const eligiblePath = path => /^(app|components|lib|workers|tests|docs|scripts|public|styles)\//.test(path);
            const safePackageChange = file => file.filename === 'package.json'
              && file.deletions === 0 && Boolean(file.patch)
              && file.patch.split('\n').filter(line => line.startsWith('+') && !line.startsWith('+++'))
                .every(line => /^\+\s*"docs:links(?::(?:report|test))?":\s*"[^"]+"\s*,?$/.test(line));
            let approved = 0, blocked = 0;
            for (const run of pending) {
              if (approved >= 2) break;
              const matches = prs.filter(pr => pr.state === 'open'
                && pr.user?.login === 'Copilot' && pr.base?.ref === 'main'
                && pr.head?.repo?.full_name === `${owner}/${repo}`
                && pr.head?.sha === run.head_sha && pr.head?.ref === run.head_branch);
              if (matches.length !== 1) { blocked++; continue; }
              const pr = matches[0];
              const files = await github.paginate(github.rest.pulls.listFiles,
                {owner, repo, pull_number: pr.number, per_page: 100});
              // Never approve workflow/config/secrets/migrations changes. The CI uses read-only token.
              const allowed = files.length > 0 && files.length <= 30 && files.every(f =>
                (f.status === 'added' || f.status === 'modified')
                && f.additions <= 500 && f.deletions <= 500
                && (eligiblePath(f.filename) || safePackageChange(f)));
              if (!allowed) { blocked++; core.notice(`CI approval blocked by scope for PR #${pr.number}`); continue; }
              // GitHub rechecks author eligibility and run state at the approval endpoint.
              try {
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/approve',
                  {owner, repo, run_id: run.id});
                approved++; core.notice(`Approved unprivileged CI run ${run.id} for Copilot PR #${pr.number}`);
              } catch (e) {
                blocked++; core.warning(`Copilot CI approval rejected for PR #${pr.number} (HTTP ${e.status || 'unknown'})`);
              }
            }
            core.summary.addRaw(`Copilot CI approval: approved=${approved}, blocked=${blocked}, pending=${pending.length}.`);
