name: MentionCheck CI auto-recovery
# Trusted default-branch workflow; zero PR checkout with a write token.
# No deploy, no commercial activation, at most two bounded agent tasks per run.
on:
  workflow_run:
    workflows: ["MentionCheck CI"]
    types: [completed]
  schedule:
    - cron: '27,57 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  pull-requests: read
  issues: write
concurrency:
  group: mentioncheck-ci-auto-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: github.repository == 'totorina47501-wq/Project3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover bot-blocked CI and request bounded agent fixes
        uses: actions/github-script@v7
        env:
          HAS_COPILOT_TOKEN: ${{ (secrets.COPILOT_DISPATCH_TOKEN != '' || secrets.GH_AW_AGENT_TOKEN != '') && 'true' || 'false' }}
          COPILOT_REPAIR_TOKEN: ${{ secrets.COPILOT_DISPATCH_TOKEN || secrets.GH_AW_AGENT_TOKEN }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            if (owner!=='totorina47501-wq' || repo!=='Project3' || context.ref!=='refs/heads/main') throw Error('Untrusted recovery context');
            const source=context.payload.workflow_run;
            const mainRecovery=source?.name==='MentionCheck CI' && source.conclusion==='success' && source.head_branch==='main' && ['push','workflow_dispatch'].includes(source.event);
            if (context.eventName==='workflow_run' && (source?.name!=='MentionCheck CI' || (!mainRecovery && !['action_required','failure','timed_out'].includes(source.conclusion)))) return;
            const blockedLabels=new Set(['release:evidence-required','security:manual','do-not-merge','legal:blocked','billing:blocked']);
            const activeAgentLabels=new Set(['agent:codex','agent:approved']);
            const runsFor=async branch=>github.paginate(github.rest.actions.listWorkflowRunsForRepo,{owner,repo,branch,per_page:100});
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            let recovered=0,requested=0,skipped=0;
            for(const pr of prs.sort((a,b)=>a.number-b.number)){
              if(recovered+requested>=2)break; // Never launch unbounded parallel repairs.
              if(pr.base?.ref!=='main' || pr.head?.repo?.full_name!==owner+'/'+repo ||
                 !/^(?:codex|copilot)\//.test(pr.head?.ref||''))continue;
              if(source && !mainRecovery && pr.head.sha!==source.head_sha)continue;
              if((pr.labels||[]).some(l=>blockedLabels.has(l.name)) ||
                 /EN PAUSE|PAUSED|BLOCKED/i.test(pr.title))continue;
              const issueMatch=String(pr.body||'').match(/-\s*(?:Refs?|Fix(?:es|ed)?|Clos(?:e|es|ed))\s+#(\d+)\s*$/i);
              if(!issueMatch)continue;
              const ticket=(await github.rest.issues.get({owner,repo,issue_number:Number(issueMatch[1])})).data;
              if(ticket.state!=='open'||ticket.pull_request ||
                 !ticket.labels?.some(l=>activeAgentLabels.has(l.name))||
                 ticket.labels?.some(l=>blockedLabels.has(l.name))||
                 !ticket.assignees?.some(a=>['Codex','Copilot','copilot-swe-agent[bot]'].includes(a.login))||
                 /EN PAUSE|PAUSED|BLOCKED/i.test(ticket.title))continue;
              // Never run a branch-controlled workflow changed by an agent.
              const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:pr.number,per_page:100});
              if(!files.length || files.length>50 || files.some(f=>
                  /^\.github\/|^wrangler(?:\.|$)|^\.env|^scripts\/recette\/production/i.test(f.filename)))continue;
              const runs=(await runsFor(pr.head.ref)).filter(x=>x.head_sha===pr.head.sha &&
                x.name==='MentionCheck CI' && x.path==='.github/workflows/ci.yml');
              if(runs.some(x=>x.status==='completed'&&x.conclusion==='success'))continue;
              if(runs.some(x=>['queued','in_progress','pending','waiting'].includes(x.status)))continue;
              const dispatched=runs.some(x=>x.event==='workflow_dispatch');
              const latest=runs.sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at))[0];
              if(!latest || latest.status!=='completed')continue;
              if(latest.conclusion==='action_required' && !dispatched){
                const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                  {owner,repo,run_id:latest.id,filter:'latest',per_page:100});
                if(jobs.length!==0)continue;
                // Read-only CI; no deployment, Stripe, OpenAI, or production credentials.
                await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'ci.yml',ref:pr.head.ref});
                recovered++;
                core.notice('Recovered blocked CI on PR #'+pr.number+' SHA '+pr.head.sha+' by trusted workflow_dispatch.');
                continue;
              }
              if(!['failure','timed_out'].includes(latest.conclusion))continue;
              const jobs=await github.paginate(github.rest.actions.listJobsForWorkflowRun,
                {owner,repo,run_id:latest.id,filter:'latest',per_page:100});
              const failed=jobs.flatMap(j=>(j.steps||[]).filter(s=>s.conclusion==='failure').map(s=>s.name));
              const transient=failed.length>0 && failed.every(name=>
                /^(?:Installer Chromium|Cache Chromium Playwright|Cache FFmpeg statique pour CI|Installer FFmpeg et FFprobe|Installer les dépendances|Run actions\/(?:checkout|setup-node|cache)@)/.test(name));
              if(transient && (latest.run_attempt||1)===1){
                await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs',
                  {owner,repo,run_id:latest.id});
                recovered++;
                core.notice('Retried only transient failed jobs on PR #'+pr.number+'; maximum one retry.');
                continue;
              }
              // A comment is a bounded coding task on the EXISTING PR, not a code review.
              if(process.env.HAS_COPILOT_TOKEN!=='true'){
                core.warning('No approved user token to ask @copilot for CI correction; retained protections.');
                continue;
              }
              const comments=await github.paginate(github.rest.issues.listComments,
                {owner,repo,issue_number:pr.number,per_page:100});
              const prefix='mentioncheck-ci-autofix:';
              const attempts=comments.filter(c=>String(c.body||'').includes('<!-- '+prefix));
              if(attempts.length>=2 || attempts.some(c=>String(c.body||'').includes('<!-- '+prefix+pr.head.sha+' -->')))continue;
              const names=failed.slice(0,5).join(', ')||'Consulter les jobs en échec';
              const comment='<!-- '+prefix+pr.head.sha+' -->\n'+
                '@copilot Corrige **uniquement** la CI en échec sur cette PR existante (SHA '+pr.head.sha+').\n'+
                'Run: https://github.com/'+owner+'/'+repo+'/actions/runs/'+latest.id+
                '\nEtapes en échec : '+names+'.\n'+
                'Conserve le périmètre de l’issue #'+ticket.number+', évite les doublons, ajoute des tests de non-régression, '+
                'ne modifie ni workflows, ni secrets, ni données de production, ni facturation/CGV/société, '+
                'ne déploie pas et ne fusionne pas avant CI verte sur le SHA final. '+
                'Si la cause exige une permission ou un fournisseur externe, signale BLOCKED au lieu de contourner la protection.\n'+
                '**Maximum deux demandes auto par PR ; aucune revue Copilot automatique.**';
              const response=await fetch('https://api.github.com/repos/'+owner+'/'+repo+'/issues/'+pr.number+'/comments',{
                method:'POST',
                headers:{
                  'Authorization':'Bearer '+process.env.COPILOT_REPAIR_TOKEN,
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'
                },
                body:JSON.stringify({body:comment}),
                signal:AbortSignal.timeout(15000)
              });
              if(!response.ok)throw Error('Approved Copilot repair token could not post a PR comment (HTTP '+response.status+').');
              requested++;
              core.notice('Asked Copilot once to fix actual CI failure on PR #'+pr.number+'; head '+pr.head.sha);
            }
            core.summary.addRaw('CI auto-recovery: dispatched/retried '+recovered+', requested repairs '+requested+', skipped '+skipped+'.');
